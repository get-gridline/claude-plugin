# The public mirror's CI. **A template, copied into the mirror by publish-plugin.yml.**
#
# **Deliberately not in `.github/workflows/`.** Actions scans that directory and would run this file
# here on every pull request — where `hooks/guard.py` does not exist at the repository root, so it
# would fail on every PR for a reason unrelated to the change. `on: push: branches: [main]` is
# harmless in a repository whose default branch is `master`, but `on: pull_request` is not.
#
# Generated rather than maintained over there, which is the answer to "two copies of the checks will
# drift". There is one copy — this one — and the mirror's is a build output like everything else in
# it. `check_plugin.py` is copied in beside it and takes the plugin root as an argument, so the same
# script serves both layouts.
#
# What it adds over the checks that already ran upstream: these run **in the published layout, in
# the repository customers clone**. The distinction is not theoretical — the first release caught a
# file upstream had let through, because every path the checker inspects is relative to the plugin
# root and that root differs between the two.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # First, because it is the one protecting a customer's credentials. It fails open by design —
      # a hook that blocked on every unfamiliar input would be uninstalled within the hour, and then
      # it guards nothing — so a crash prints nothing and Claude Code reads that as "no opinion".
      # This is what stops a bug disabling it silently.
      - name: the guard hook's own rules
        run: python3 hooks/guard.py --selftest

      # Everything else about a plugin degrades to silence too: frontmatter that will not parse never
      # triggers, an over-long description is truncated so a skill fires on some triggers and not
      # others, and a command naming a missing skill appears in the `/` menu and does nothing.
      - name: every manifest, skill, command and subagent loads
        run: python3 .github/scripts/check_plugin.py .

      # A tripwire for copied prose, not a leak scan: there is nothing internal in this repository to
      # leak, but its text is written alongside Gridline's own and prose gets copied.
      - name: no Gridline-internal references
        run: |
          if grep -rniE 'make (test|run|live|kms|chart|images)\b|\.claude/rules|docs/[0-9]|(^|[^a-z])integration/|localstack|control-plane/src|proxy/internal|tunnel/internal|alembic|sqlalchemy|GRIDLINE_MASTER_KEY|GRIDLINE_KMS|context_for|delivery_ikm|session_turns|getartifact' \
             --exclude-dir=.git --exclude-dir=.github . ; then
            echo
            echo "The lines above name something internal to Gridline, and this repository is"
            echo "public. A published detail cannot be unpublished."
            exit 1
          fi
          echo "no internal references."

  # **The tag is created on merge, here, rather than pushed from upstream.** It is the record that a
  # version shipped, and upstream reads it to decide whether to propose anything — so creating it
  # before a human merged would make an unreviewed release look published and block the real one.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag this version if it is not already tagged
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "gridline ${version}"
          git push origin "v${version}"
          echo "Tagged v${version}."
